{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-lg shadow">
  <h2 class="text-2xl font-bold mb-6 text-center">CBT Readiness Exam</h2>
  <form method="POST" action="{{ url_for('start_exam') }}">
    <div class="mb-4">
      <label class="block font-semibold">Full Name</label>
      <input type="text" name="student_name" required class="w-full border p-2 rounded">
    </div>
    <div class="mb-4">
      <label class="block font-semibold">Matric No</label>
      <input type="text" name="matric_no" required class="w-full border p-2 rounded">
    </div>
    <div class="mb-4">
      <label class="block font-semibold">Subject</label>
      <select name="subject" required class="w-full border p-2 rounded">
        {% for s in subjects %}
        <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Start 30min Exam</button>
  </form>
</div>
{% endblock %}
