{% extends "base.html" %}

{% block content %}
<h2 class="text-3xl font-bold text-blue-900 mb-6">Admin Dashboard</h2>

<!-- 4 Stat Cards -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
    <div class="bg-white text-center rounded-lg shadow p-6 border">
        <div class="text-4xl font-bold text-blue-900">{{ user_count }}</div>
        <div class="text-gray-600">Total Students</div>
    </div>
    <div class="bg-white text-center rounded-lg shadow p-6 border">
        <div class="text-4xl font-bold text-blue-900">{{ q_count }}</div>
        <div class="text-gray-600">Total Questions</div>
    </div>
    <div class="bg-white text-center rounded-lg shadow p-6 border">
        <div class="text-4xl font-bold text-blue-900">{{ exam_count }}</div>
        <div class="text-gray-600">Total Exams</div>
    </div>
    <div class="bg-white text-center rounded-lg shadow p-6 border">
        <div class="text-4xl font-bold text-blue-900">{{ attempt_count }}</div>
        <div class="text-gray-600">Total Attempts</div>
    </div>
    
</div>

<!-- Actions -->
<div class="bg-white p-6 rounded-lg shadow border mb-8">
    <h3 class="text-xl font-bold text-blue-900 mb-4">Quick Actions</h3>
    <div class="flex gap-4 flex-wrap">
        
        <a href="/admin/upload_questions" class="bg-purple-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-purple-700 shadow">
            + Upload Questions via Image/PDF/CSV
        </a>

        <a href="/admin/upload_questions_csv" class="bg-yellow-500 text-white px-6 py-3 rounded-lg font-bold hover:bg-yellow-600 shadow">
            + Upload CSV Only
        </a>

        <a href="/add_user" class="bg-blue-900 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-950 shadow">
            + Add User
        </a>
    </div>
</div>
{% endblock %}
