<!doctype html>
<html>
<head>
<title>Predict Readiness - CBT System</title>
<style>
body { font-family: Arial; background: #f5f7fb; padding: 30px; }
.container { background: white; padding: 25px; border-radius: 12px; max-width: 600px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
h2 { color: #1a56db; text-align:center; }
label { font-weight: bold; display:block; margin-top:10px; }
input { width: 95%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; }
.btn { background: #dc2626; color: white; padding: 12px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width:100%; }
</style>
</head>
<body>
<div class="container">
<h2>Predict Student Examination Readiness</h2>
<form method="POST" action="/predict">
    <label>Avg Response Time (sec)</label><input type="number" step="0.01" name="avg_response_time_sec" required>
    <label>Revision Rate</label><input type="number" step="0.01" name="revision_rate" required>
    <label>Accuracy Easy</label><input type="number" step="0.01" name="accuracy_easy" required>
    <label>Accuracy Medium</label><input type="number" step="0.01" name="accuracy_medium" required>
    <label>Accuracy Hard</label><input type="number" step="0.01" name="accuracy_hard" required>
    <label>Time Management Score</label><input type="number" step="0.01" name="time_management_score" required>
    <label>Completion Rate</label><input type="number" step="0.01" name="completion_rate" required>
    <label>Consistency Score</label><input type="number" step="0.01" name="consistency_score" required>
    <button type="submit" class="btn">Predict</button>
</form>
<br><a href="/">← Back to Dashboard</a>
</div>
</body>
</html>
